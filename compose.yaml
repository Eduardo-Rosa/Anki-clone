services:
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ankiclone
      POSTGRES_USER: ankiclone
      POSTGRES_PASSWORD: ankiclone

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ankiclone -d ankiclone"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: